<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<title>Macro & Fitness Tracker</title>
<meta name="theme-color" content="#14161C" />
<meta name="description" content="Track meals, weight, and workouts." />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icons/icon-192.png" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Tracker" />
<link rel="stylesheet" href="css/styles.css" />
</head>
<body>

<header id="app-header">
  <h1>Tracker</h1>
  <div style="display:flex;align-items:center;gap:12px;">
    <span class="header-sub" id="header-date"></span>
    <button id="settings-btn" aria-label="Settings" style="background:none;border:none;color:var(--text-dim);padding:4px;display:flex;">
      <svg viewBox="0 0 24 24" style="width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.8;"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </button>
  </div>
</header>

<main id="app-content"></main>

<nav id="bottom-nav"></nav>

<script>
  document.getElementById('header-date').textContent = new Date().toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' });
</script>
<script src="js/db.js"></script>
<script src="js/charts.js"></script>
<script src="js/github-api.js"></script>
<script src="js/dashboard.js"></script>
<script src="js/meals.js"></script>
<script src="js/weight.js"></script>
<script src="js/workout.js"></script>
<script src="js/sync.js"></script>
<script src="js/app.js"></script>
<script>
  document.getElementById('settings-btn').addEventListener('click', () => navigate('settings'));
</script>
</body>
</html>
